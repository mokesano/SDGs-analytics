# Workflow: Codacy Security Scan
#
# Menjalankan Codacy Analysis CLI dan mengunggah SARIF ke GitHub Code Scanning
# hanya jika file SARIF benar-benar berhasil dibuat dan valid. Validasi ini
# mencegah error upload seperti:
#   Error: Invalid SARIF. JSON syntax error: Unexpected end of JSON input

name: Codacy Security Scan

on:
  push:
    branches: ["develop", "master", "production"]
  pull_request:
    branches: ["develop", "master", "production"]
  schedule:
    - cron: "33 18 * * 1" # Setiap Senin pukul 18:33 UTC

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Codacy Analysis CLI
        id: codacy
        uses: codacy/codacy-analysis-cli-action@v4.4.7
        continue-on-error: true
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647
          verbose: true

      - name: Validate SARIF output
        id: sarif
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s results.sarif ]]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Codacy did not produce a non-empty SARIF file; skipping upload."
            exit 0
          fi

          if ! jq -e '.version and (.runs | type == "array")' results.sarif > /dev/null; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Codacy produced an invalid SARIF file; skipping upload to avoid upload-sarif failure."
            echo "First bytes of results.sarif for debugging:"
            head -c 1000 results.sarif || true
            echo
            exit 0
          fi

          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "Codacy SARIF is valid and will be uploaded."

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: steps.sarif.outputs.valid == 'true'
        with:
          sarif_file: results.sarif
          category: codacy-security

      - name: Report Codacy execution status
        if: steps.codacy.outcome == 'failure'
        shell: bash
        run: |
          echo "Codacy Analysis CLI ended with a non-zero status."
          echo "The workflow did not fail automatically so SARIF validation/upload handling can stay deterministic."
          echo "Review the Codacy step logs for the scanner failure details."
