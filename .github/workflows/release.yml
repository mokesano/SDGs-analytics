# Workflow: Release Otomatis (Semantic Release) untuk Library PHP
#
# Workflow ini hanya membuat rilis resmi dari branch master dan production,
# sesuai release.config.js. Push ke develop tetap diterima oleh workflow, tetapi
# tidak menjalankan release atau deploy sehingga tidak gagal ketika secret
# environment develop (DEV_SSH_KEY, DEV_HOST, DEV_USER, DEV_PATH) belum disetel.

name: Release Otomatis (Semantic Release)

on:
  push:
    branches:
      - master
      - develop
      - production

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install semantic-release dan plugin
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/github \
            @semantic-release/git \
            conventional-changelog-conventionalcommits

      - name: Jalankan semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
